/* ===== Resumen de la ruta ===== */

/* ===== Ver jornada ===== */
.vrh{align-items:flex-start;justify-content:flex-start;gap:6px}.vrh>div{min-width:0}.vrh h1{font-size:1.5rem;line-height:1.15;text-wrap:balance}.vrh .gb{margin:-4px 0 0 -10px}

button.pt.vr{width:100%;text-align:left;border-radius:12px;padding:8px 6px;margin:0 -6px;width:calc(100% + 12px)}

.vracts{display:flex;gap:8px;flex-wrap:wrap}.vracts .btn{flex:1 1 30%}
body.v-ver .mtools #mFit{display:grid}

.vlist{display:flex;flex-direction:column;max-height:52dvh;overflow:auto;margin:0 -4px}

.vit>svg{color:var(--mu);width:16px;height:16px}
