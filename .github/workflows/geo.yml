# Diagnóstico manual: ¿la búsqueda encuentra las direcciones que da el mapa?
name: Diagnóstico de búsqueda
on: workflow_dispatch
jobs:
  geo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/diag/geo.mjs
