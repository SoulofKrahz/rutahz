# Diagnóstico manual: ¿la búsqueda encuentra las direcciones que da el mapa?
name: Diagnóstico de búsqueda
on:
  workflow_dispatch:
    inputs:
      cual:
        description: "geo (dirección del mapa) o nuevo (comparar buscadores)"
        default: nuevo
jobs:
  geo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/diag/geo.mjs
        if: github.event.inputs.cual != 'nuevo'
      - run: node tools/diag/geo2.mjs
        if: github.event.inputs.cual == 'nuevo'
