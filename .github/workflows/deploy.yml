# Prueba la app y, si todo va bien, publica la carpeta site/ en Cloudflare Pages (rama main).
# Secretos (Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Variable: CF_PROJECT = nombre del proyecto de Pages (rutahz).
name: Publicar en Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'tests/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright y Chromium
        run: npm i --no-save --no-audit --no-fund playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Probar la app (10 pruebas en móvil y PC)
        run: node tests/suite.cjs
  deploy:
    name: Publicar
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - name: Generar version.txt (aviso de versión nueva)
        run: grep -o "const VER = '[^']*'" site/index.html | cut -d"'" -f2 > site/version.txt && cat site/version.txt
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PROJECT }} --branch=main --commit-dirty=true
      # Cloudflare a veces da la publicación por buena pero no la pone como principal: se comprueba y se repite una vez
      - name: Comprobar que la web sirve la versión nueva
        id: v1
        continue-on-error: true
        run: |
          want=$(cat site/version.txt); url="https://${{ vars.CF_PROJECT }}.pages.dev/version.txt"
          for i in $(seq 1 12); do got=$(curl -sS -m 15 "$url?x=$RANDOM" | tr -d '[:space:]'); echo "intento $i: $got (esperada $want)"; [ "$got" = "$want" ] && exit 0; sleep 10; done; exit 1
      - name: Publicar otra vez
        if: steps.v1.outcome == 'failure'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PROJECT }} --branch=main --commit-dirty=true
      - name: Comprobar otra vez
        if: steps.v1.outcome == 'failure'
        run: |
          want=$(cat site/version.txt); url="https://${{ vars.CF_PROJECT }}.pages.dev/version.txt"
          for i in $(seq 1 12); do got=$(curl -sS -m 15 "$url?x=$RANDOM" | tr -d '[:space:]'); echo "intento $i: $got (esperada $want)"; [ "$got" = "$want" ] && exit 0; sleep 10; done
          echo "::error::La web sigue sin servir la versión $want: revisa Cloudflare › rutahz › Deployments"; exit 1
